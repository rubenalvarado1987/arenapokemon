linters-settings:
  goimports:
    local-prefixes: github.com/alvaradoruben/myapp
  govet:
    enable-all: true
  revive:
    rules:
      - name: exported
  exhaustive:
    default-signifies-exhaustive: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - goimports
    - revive
    - misspell
    - unconvert
    - prealloc
    - bodyclose
    - noctx

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck

run:
  timeout: 5m
